<text x="1446.7" y="882.0" font-size="15.3" font-weight="bold" text-anchor="middle" text-decoration="underline">DETALHE 3 — SERRILHADO (vista do vão)</text>
<text x="1446.7" y="898.0" font-size="9.7" text-anchor="middle">ESCALA 1:3</text>
<rect x="100.0" y="845.0" width="1070.0" height="14.0" fill="#eee" stroke="#222" stroke-width="0.6"/>
<text x="103.0" y="854.8" font-size="9.0" text-anchor="start" font-weight="bold">#</text>
<text x="133.0" y="854.8" font-size="9.0" text-anchor="start" font-weight="bold">SEQUÊNCIA DE MONTAGEM</text>
<rect x="100.0" y="859.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="868.8" font-size="9.0" text-anchor="start">1</text>
<text x="133.0" y="868.8" font-size="9.0" text-anchor="start">Locar os 11 eixos a 2&#x27;-1 7/8&quot;; furos Ø12&quot; x 3&#x27;-6&quot;; 6&quot; de brita no fundo.</text>
<rect x="100.0" y="873.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="882.8" font-size="9.0" text-anchor="start">2</text>
<text x="133.0" y="882.8" font-size="9.0" text-anchor="start">Prumar e alinhar os núcleos 4x4 com escoras e linha; concretar; colar com caimento. Curar 48 h.</text>
<rect x="100.0" y="887.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="896.8" font-size="9.0" text-anchor="start">3</text>
<text x="133.0" y="896.8" font-size="9.0" text-anchor="start">Cortar todos os núcleos na mesma altura (7&#x27;-6 1/2&quot; acima do terreno), com nível laser ou mangueira.</text>
<rect x="100.0" y="901.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="910.8" font-size="9.0" text-anchor="start">4</text>
<text x="133.0" y="910.8" font-size="9.0" text-anchor="start">Fabricar os 20 serrilhados juntos, com gabarito: 16 encaixes de 3 9/16&quot; x 1 1/2&quot;, passo 5 1/8&quot;.</text>
<rect x="100.0" y="915.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="924.8" font-size="9.0" text-anchor="start">5</text>
<text x="133.0" y="924.8" font-size="9.0" text-anchor="start">Fixar as faces 2x6 do LADO DO VIZINHO nos núcleos (parafuso inox, cola PU).</text>
<rect x="100.0" y="929.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="938.8" font-size="9.0" text-anchor="start">6</text>
<text x="133.0" y="938.8" font-size="9.0" text-anchor="start">Fixar os serrilhados nas laterais dos núcleos, com os encaixes voltados para o lado da casa.</text>
<rect x="100.0" y="943.0" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="952.7" font-size="9.0" text-anchor="start">7</text>
<text x="133.0" y="952.7" font-size="9.0" text-anchor="start">Encaixar as ripas pelo lado da casa, de baixo para cima; 1 parafuso inox por ponta no serrilhado.</text>
<rect x="100.0" y="956.9" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="966.7" font-size="9.0" text-anchor="start">8</text>
<text x="133.0" y="966.7" font-size="9.0" text-anchor="start">Fechar com as faces 2x6 do LADO DA CASA: elas travam as ripas nos encaixes.</text>
<rect x="100.0" y="970.9" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="980.7" font-size="9.0" text-anchor="start">9</text>
<text x="133.0" y="980.7" font-size="9.0" text-anchor="start">Vigas duplas 2x8 com parafuso passante 1/2&quot; por poste (emenda sobre o poste do meio).</text>
<rect x="100.0" y="984.9" width="1070.0" height="14.0" fill="none" stroke="#999" stroke-width="0.4"/>
<text x="103.0" y="994.7" font-size="9.0" text-anchor="start">10</text>
<text x="133.0" y="994.7" font-size="9.0" text-anchor="start">Caibros com ponta recortada sobre as vigas, 1 por poste; parafuso estrutural.</text>
<rect x="1205.0" y="920.0" width="460.0" height="145.0" fill="#fff" stroke="#222" stroke-width="1.5"/>
<line x1="1205.0" y1="962.0" x2="1665.0" y2="962.0" stroke="#222" stroke-width="0.8"/>
<line x1="1575.0" y1="962.0" x2="1575.0" y2="1065.0" stroke="#222" stroke-width="0.8"/>
<text x="1211.0" y="934.0" font-size="10.4" text-anchor="start" font-weight="bold">Kitchen Privacy Screen — 265 in x ~8 ft, ripado de cedro + topo</text>
<text x="1211.0" y="947.0" font-size="10.4" text-anchor="start" font-weight="bold">pergolado (Cornelius, NC)</text>
